name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run Tests
        run: make test

  build-amd64:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build AMD64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/xboard-node-linux-amd64 \
            ./cmd/xboard-node

      - uses: actions/upload-artifact@v4
        with:
          name: xboard-node-linux-amd64
          path: dist/xboard-node-linux-amd64

  build-arm64:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build ARM64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/xboard-node-linux-arm64 \
            ./cmd/xboard-node

      - uses: actions/upload-artifact@v4
        with:
          name: xboard-node-linux-arm64
          path: dist/xboard-node-linux-arm64

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/neukchill/xboard-node:latest
            ghcr.io/neukchill/xboard-node:${{ github.sha }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-amd64
      - build-arm64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xboard-node-linux-amd64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: xboard-node-linux-arm64
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/xboard-node-linux-amd64
            dist/xboard-node-linux-arm64
