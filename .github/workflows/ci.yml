name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Debug module state
        run: |
          echo "=== probe.go ==="
          cat sudoku-patched/apis/probe.go || echo "NOT FOUND"
          echo "=== go.mod replace ==="
          grep -A1 "SUDOKU\|sudoku-patched" go.mod || echo "NOT FOUND"
          echo "=== go build apis ==="
          go build github.com/SUDOKU-ASCII/sudoku/apis && echo "OK" || echo "FAIL"
          echo "=== go version ==="
          go version
      - name: Run tests
        run: make test

  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/neukchill/xboard-node:latest
            ghcr.io/neukchill/xboard-node:${{ github.sha }}
            
  build-binary:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o dist/xboard-node ./cmd/xboard-node

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xboard-node-linux-amd64
          path: dist/xboard-node

build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build ARM64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o dist/xboard-node ./cmd/xboard-node

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xboard-node-linux-arm64
          path: dist/xboard-node
